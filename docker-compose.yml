services:
  backend:
    image: 192.168.0.103:5000/vgradio/backend:latest
    container_name: vgradio-backend
    restart: unless-stopped
    environment:
      VGRADIO_DATA_DIR: /data
      VGRADIO_ADDR: :8080
    volumes:
      - vgradio-data:/data
    ports:
      - "8086:8080"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vgradio-api.rule=Host(`vgradio-api.lab`)"
      - "traefik.http.routers.vgradio-api.entrypoints=websecure"
      - "traefik.http.routers.vgradio-api.tls=true"
      - "traefik.http.services.vgradio-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.vgradio-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.vgradio-api-path.rule=Host(`vgradio.lab`) && PathPrefix(`/api`)"
      - "traefik.http.routers.vgradio-api-path.entrypoints=websecure"
      - "traefik.http.routers.vgradio-api-path.tls=true"
      - "traefik.http.routers.vgradio-api-path.middlewares=vgradio-api-strip"
      - "traefik.http.routers.vgradio-api-path.service=vgradio-api"

  web:
    image: 192.168.0.103:5000/vgradio/web:latest
    container_name: vgradio-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8085:80"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vgradio-web.rule=Host(`vgradio.lab`)"
      - "traefik.http.routers.vgradio-web.entrypoints=websecure"
      - "traefik.http.routers.vgradio-web.tls=true"
      - "traefik.http.services.vgradio-web.loadbalancer.server.port=80"

volumes:
  vgradio-data:

networks:
  traefik-net:
    external: true
